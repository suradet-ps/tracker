<!-- index.html -->
<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2724" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="ระบบติดตามใบสั่งซื้อยา งานเภสัชกรรม โรงพยาบาลสระโบสถ์ - นำเข้า จัดซื้อ ติดตามสถานะ และแจ้งเตือนผ่าน Telegram"
    />
    <title>Tracker · ระบบติดตามการสั่งซื้อยา</title>

    <!-- Import Google Font: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Script to prevent FOUC for dark mode -->
    <script>
      (function () {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
